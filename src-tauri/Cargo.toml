[package]
name = "ma-journee-desktop"
version = "0.18.0"
edition = "2024"

[lib]
name = "ma_journee_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
log = "0.4"
notify-rust = "4"
# Ouverture d'URL/fichiers externes via l'API native de chaque OS (ShellExecuteW sous Windows,
# xdg-open sous Linux) : evite tout passage par `cmd /C start` et son re-parsing des metacaracteres.
opener = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.49", features = ["local-offset"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
