[package]
name = "ma-journee-desktop"
version = "0.21.0"
edition = "2024"

[lib]
name = "ma_journee_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
# Sans la feature `zip` (defaut) : les artefacts de mise a jour v2 (`createUpdaterArtifacts: true`)
# sont des binaires bruts (.exe NSIS, AppImage non compressee), jamais des archives. Evite aussi
# zip 4.x et ses failles d'extraction (RUSTSEC-2026-0367/0368/0369).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
log = "0.4"
notify-rust = "4"
# Ouverture d'URL/fichiers externes via l'API native de chaque OS (ShellExecuteW sous Windows,
# xdg-open sous Linux) : evite tout passage par `cmd /C start` et son re-parsing des metacaracteres.
opener = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.49", features = ["local-offset"] }
argon2 = { version = "0.5", features = ["std"] }

# Windows Hello (verrouillage) : deja tires par Tauri, aucune version supplementaire compilee.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_System_WinRT"] }
windows-future = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
